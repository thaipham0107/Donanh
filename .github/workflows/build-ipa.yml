name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cài XcodeGen và tạo dự án
        run: |
          brew install xcodegen
          xcodegen

      - name: Build (không ký – Sideloadly sẽ ký bằng Apple ID của bạn)
        run: |
          xcodebuild -project DonAnh.xcodeproj -target DonAnh \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:" build.log | head -60; tail -40 build.log; exit 1; }
          grep -E "warning:" build.log | sort -u | head -40 || true
          test -d build/Release-iphoneos/DonAnh.app

      - name: Đóng gói IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/DonAnh.app Payload/
          zip -qry DonAnh.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: DonAnh-ipa
          path: DonAnh.ipa
