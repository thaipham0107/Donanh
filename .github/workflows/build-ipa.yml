name: Build IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cài XcodeGen và tạo dự án
        run: |
          brew install xcodegen
          xcodegen

      - name: Build (không ký – Sideloadly sẽ ký bằng Apple ID của bạn)
        run: |
          xcodebuild -project DonAnh.xcodeproj -target DonAnh \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:" build.log | head -60; tail -40 build.log; exit 1; }
          grep -E "warning:" build.log | sort -u | head -40 || true
          test -d build/Release-iphoneos/DonAnh.app

      - name: Đóng gói IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/DonAnh.app Payload/
          zip -qry DonAnh.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: DonAnh-ipa
          path: DonAnh.ipa

      - name: Đăng lên Releases (bản mới nhất)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest DonAnh.ipa --title "Dọn Ảnh – bản mới nhất" \
            --notes "Tải DonAnh.ipa rồi cài bằng Sideloadly. Xem hướng dẫn trong README." --latest
