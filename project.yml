name: DonAnh
options:
  bundleIdPrefix: com.thaipham
  deploymentTarget:
    iOS: "16.0"
targets:
  DonAnh:
    type: application
    platform: iOS
    sources:
      - DonAnh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thaipham.donanh
        PRODUCT_NAME: DonAnh
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Dọn Ảnh"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Dọn Ảnh cần truy cập thư viện để tìm ảnh trùng, video nặng và xoá theo lựa chọn của bạn. Ảnh không rời khỏi iPhone."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
